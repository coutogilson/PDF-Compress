name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: PDF-Compress.exe
          - os: ubuntu-latest
            name: linux
            artifact: PDF-Compress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m PyInstaller --onefile --windowed --name PDF-Compress app.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m PyInstaller --onefile --windowed --name PDF-Compress app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-compress-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdf-compress-windows/PDF-Compress.exe
            artifacts/pdf-compress-linux/PDF-Compress
          generate_release_notes: true
